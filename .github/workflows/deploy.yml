name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: yobachat-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on:
      - self-hosted
      - linux
      - yobachat-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Ensure deploy directories exist
        run: |
          mkdir -p /var/www/yobachat
          mkdir -p /var/www/yobachat/logs
          mkdir -p /var/www/yobachat/server/storage
          mkdir -p /var/www/yobachat/shared

      - name: Sync app files to server path
        run: |
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "node_modules/" \
            --exclude "logs/" \
            --exclude "server/storage/" \
            --exclude "server/server-config*.json" \
            --exclude "shared/shared-config*.json" \
            ./ /var/www/yobachat/

      - name: Install dependencies for build
        run: |
          cd /var/www/yobachat
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Build app in deploy path
        run: |
          cd /var/www/yobachat
          npm run prod:build:all

      - name: Prune to production dependencies
        run: |
          cd /var/www/yobachat
          npm --prefix server prune --omit=dev

      - name: Restart PM2 app
        run: |
          cd /var/www/yobachat
          pm2 delete yobachat-prod >/dev/null 2>&1 || true
          pm2 start ecosystem.config.cjs --only yobachat-prod --update-env
          pm2 save

      - name: Health check
        env:
          HEALTHCHECK_URL: http://127.0.0.1:9011/ws/
        run: |
          set -euo pipefail
          for i in {1..30}; do
            HTTP_CODE="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Connection: Upgrade" \
              -H "Upgrade: websocket" \
              -H "Sec-WebSocket-Version: 13" \
              -H "Sec-WebSocket-Key: SGVsbG8sIHdvcmxkIQ==" \
              "$HEALTHCHECK_URL" || true)"
            if [ "$HTTP_CODE" = "101" ]; then
              echo "Health check passed: $HEALTHCHECK_URL"
              exit 0
            fi
            echo "Health check attempt $i/30 failed (HTTP $HTTP_CODE), retrying..."
            sleep 2
          done
          echo "Health check failed: $HEALTHCHECK_URL"
          exit 1
